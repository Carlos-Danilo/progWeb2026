{% extends "base.html" %}
{% load static %}

{% block title %}Excluir Fabricante{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<div id="content">
    <div class="container">
        <form method="POST" action="/fabricante/delete">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ fabricante.id }}">
            <div class="row">
                <label class="col-md-2">Fabricante</label>
                <input class="form-control col-md-6" type="text" value="{{ fabricante.Fabricante }}" disabled>
            </div>
            <div class="row mt-3">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fa fa-check"></i> Excluir</button>
                <a href="{% url 'fabricante' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
