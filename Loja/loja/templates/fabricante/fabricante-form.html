{% extends "base.html" %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<div id="content">
    <div class="container">
        <form method="POST" action="{{ form_action }}">
            {% csrf_token %}
            <div class="row">
                <label for="Fabricante" class="col-md-2">Fabricante</label>
                <input class="form-control col-md-6" type="text" name="Fabricante" id="Fabricante" value="{% if fabricante %}{{ fabricante.Fabricante }}{% endif %}" required>
            </div>
            <div class="row mt-3">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fa fa-check"></i> {{ submit_label }}</button>
                <a href="{% url 'fabricante' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
